# Spring Boot Application Properties
spring.application.name=library-issue-management

# Server Port (Uses cloud PORT if provided, defaults to 8080)
server.port=${PORT:8080}

# MySQL Database Configuration
# Works locally with default values, and can be overridden by Cloud Environment Variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:monika2007}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Disable banner for cleaner startup logs
spring.main.banner-mode=console
